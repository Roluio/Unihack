<!DOCTYPE html>
<html lang="ro" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StudyGram{% endblock %} · StudyGram</title>
    <link rel="icon" type="image/png" href="/static/img/logo-64.png">
    <script src="{{ asset('theme.js') }}"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="{{ asset('app.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
<div class="app">

    <aside class="sidebar" id="sidebar">
        <a href="/home" class="brand">
            <img src="/static/img/logo-64.png" alt="">
            <span>StudyGram</span>
        </a>

        <nav class="nav" aria-label="Main">
            <a href="/home" class="{{ 'active' if active == 'home' }}">
                <i data-lucide="house"></i><span class="label" data-i18n="nav.home">Acasă</span>
            </a>
            <a href="/calendar" class="{{ 'active' if active == 'calendar' }}">
                <i data-lucide="calendar-days"></i><span class="label" data-i18n="nav.calendar">Calendar</span>
            </a>
            <a href="/library" class="{{ 'active' if active == 'library' }}">
                <i data-lucide="folder-open"></i><span class="label" data-i18n="nav.library">Biblioteca</span>
            </a>
            <a href="/messages" class="{{ 'active' if active == 'messages' }}">
                <i data-lucide="message-circle"></i><span class="label" data-i18n="nav.messages">Mesaje</span>
                <span class="badge hidden" id="badgeMessages"></span>
            </a>
            <a href="/friends" class="{{ 'active' if active == 'friends' }}">
                <i data-lucide="users-round"></i><span class="label" data-i18n="nav.friends">Prieteni</span>
                <span class="badge hidden" id="badgeFriends"></span>
            </a>
            <a href="/notifications" class="{{ 'active' if active == 'notifications' }}">
                <i data-lucide="bell"></i><span class="label" data-i18n="nav.notifications">Notificări</span>
                <span class="badge hidden" id="badgeNotifications"></span>
            </a>
            <a href="/ai">
                <i data-lucide="bot"></i><span class="label">Buddy AI</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <button type="button" class="user-chip" id="userChip" aria-haspopup="menu">
                <span class="avatar" >{{ user.initials }}</span>
                <span class="who">
                    <strong>{{ user.full_name }}</strong>
                    <small>@{{ username }}</small>
                </span>
                <i data-lucide="chevrons-up-down"></i>
            </button>
        </div>
    </aside>

    <div class="main">
        <header class="topbar">
            <button type="button" class="icon-btn menu-btn" id="menuButton" data-i18n-title="common.menu" title="Meniu">
                <i data-lucide="menu"></i>
            </button>
            <h1>{% block page_title %}{% endblock %}</h1>
            {% block topbar_extra %}{% endblock %}
            <div class="top-actions">
                <div class="lang-switch" role="group" aria-label="Language">
                    <button type="button" data-lang="ro">RO</button>
                    <button type="button" data-lang="en">EN</button>
                </div>
                <button type="button" class="sg-theme-toggle" id="sgThemeToggle" aria-pressed="false">
                    <span class="sg-sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
                    <span class="sg-moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
                </button>
            </div>
        </header>

        <main class="content {% block content_class %}{% endblock %}">
            {% block content %}{% endblock %}
        </main>
    </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
    window.APP = { user: {{ user | tojson }} };
</script>
<script src="{{ asset('i18n.js') }}"></script>
<script src="{{ asset('app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
